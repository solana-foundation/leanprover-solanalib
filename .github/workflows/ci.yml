name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Textual style checks
        run: ./scripts/lint-style.sh

      - name: Style controls
        run: python3 -B -m unittest discover -s scripts -p 'test_lint_style.py'

      - name: Prose checks
        run: |
          python3 scripts/check-prose.py
          python3 -B -m unittest discover -s scripts -p 'test_prose.py'
          python3 -B -m unittest discover -s scripts -p 'test_module_ownership.py'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ~/.elan holds the Lean toolchain (~200MB); .lake/packages holds every
      # dep clone + their pre-built oleans (~1GB with Mathlib). Both are stable
      # against any change that doesn't touch lake-manifest.json or lean-
      # toolchain, so cache aggressively keyed on those two files.
      - name: Cache Lean toolchain and Lake deps
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json', 'lean-toolchain') }}
          restore-keys: |
            lake-${{ runner.os }}-

      - name: Install elan (Lean toolchain manager)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # On a warm cache .lake/packages is already populated; lake just verifies
      # the manifest matches and exits in ~1s. On a cold cache it does the full
      # 100s+ clone of every dep.
      - name: Resolve dependencies
        run: lake update

      - name: Fetch pre-built Mathlib oleans
        run: lake exe cache get

      - name: Build library, tests and oracle
        run: lake --wfail build Solanalib SolanalibTest sbpf-oracle

      - name: Check module ownership and package boundaries
        run: |
          python3 scripts/check-module-ownership.py
          python3 tools/model-audit/import_tiers.py

      - name: Run tests
        run: lake --wfail test

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'packages/solanalib-runtime/**/*.lean') }}
          restore-keys: |
            runtime-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Lean manager
        run: |
          if ! test -x "$HOME/.elan/bin/elan"; then
            curl --fail --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build runtime and scenarios in the root package
        run: |
          lake update
          lake exe cache get Solanalib.lean SolanalibTest.lean
          lake --wfail build Solanalib SolanalibTest Solanalib.Runtime SolanalibTest.Runtime SolanalibTest.Conformance.Runtime
          python3 scripts/check-lean-loading.py
      - name: Replay controls and authenticated native recording
        run: |
          python3 -B -m unittest discover -s tools/runtime-conformance -p 'test_*.py'
          python3 -B tools/runtime-conformance/run.py --model-only --evidence-dir "$RUNNER_TEMP/runtime-replay"
      - name: Runtime source correspondence and proof audits
        run: |
          python3 -B -m unittest discover -s tools/model-audit -p 'test_*.py'
          python3 -B tools/model-audit/check_runtime.py
