name: Docs

on:
  push:
    branches: [main]
    # Only rebuild docs when something the rendered site actually depends on
    # changes. Allowlist over blocklist: a new top-level file is skipped by
    # default rather than silently triggering a 10-minute Docs build.
    paths:
      - "packages/**"
      - "tools/model-audit/**"
      - "scripts/postprocess-docs.py"
      - "scripts/build-docs.py"
      - "scripts/generate-test-index.py"
      - "docs/**"
      - "tools/library-conformance/**"
      - "Justfile"
      - ".github/actions/setup-lean/**"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LEAN_NUM_THREADS: '4'
  MATHLIB_NO_CACHE_ON_UPDATE: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cache Lean toolchain + Lake deps + doc-gen4's own build output. Without
      # this cache the doc-gen4 compile from source dominates the build at ~10
      # minutes. Cache key includes the doc-gen4 commit (resolved into the
      # manifest) so a doc-gen4 bump invalidates the cache.
      - name: Cache Lean toolchain and Lake deps
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
          key: lake-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json', 'lean-toolchain') }}-${{ hashFiles('packages/**/Solanalib/**/*.lean') }}
          restore-keys: |
            lake-docs-${{ runner.os }}-
            lake-${{ runner.os }}-

      - uses: ./.github/actions/setup-lean

      # Re-elaborate the conditional dependency even after a normal cached build.
      # Pulls the pinned doc-gen4 into the manifest.
      - name: Resolve dependencies with -Kenv=dev
        run: lake -R -Kenv=dev update

      # Downloads pre-built Mathlib oleans so we don't compile Mathlib from scratch.
      - name: Fetch pre-built Mathlib oleans
        run: lake exe cache get Mathlib.Tactic.Linter.Style Mathlib.Tactic.Linter.Header

      - name: Build documentation site
        run: just --set python python3 docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .lake/build/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
