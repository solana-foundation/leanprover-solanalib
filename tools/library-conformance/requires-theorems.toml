# Kernel-checked theorems about decided preconditions (`decidesRequires`) that no parseable record can break.
#
# [[theorem]]: negative evidence. Its statement is `¬ P` or `b = false`, about the precondition of the model
# (`requires` of its contract, a predicate that `requires` unfolds to, or the Boolean of a decider), and it uses
# a decider of that precondition in the checker: a declaration of the code of the checker that mentions
# `requires` and the contract of the model, or a family declaration such a decider uses directly.
#
# [[trivial]]: the precondition is trivial at the decided index. Its statement is `requires … ↔ True` (or
# `requires …` under binders) at exactly the index the checker uses, and it uses the decider of the checker.
#
# `run.py --model-only` requires every model whose non-trivial precondition a checker decides to have a
# family precondition control, a [[theorem]] or a [[trivial]] entry, and rejects an entry of the wrong
# shape. The table of REFERENCE.md is generated from this file by `run.py --generate-registry`. `detail` is the
# deciding family.

