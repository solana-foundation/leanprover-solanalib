# Modeled dependencies use exact constraints; incidental packages resolve afresh.

[package]
name = "conformance-address-profiles-261"
version = "0.1.0"
edition = "2021"
publish = false
workspace = "../workspaces/profile-04"

[dependencies]
conformance-recorder = { path = "../recorder" }
conformance-shim = { path = "../shim" }
solana-address = { version = "=2.6.1", default-features = false, features = ["syscalls", "borsh", "std"] }
borsh-selected = { package = "borsh", version = "=1.6.0", features = ["std"] }
solana-loader-v3-interface = "=6.1.1"
spl-associated-token-account-interface = "=2.0.0"
solana-pubkey-facade = { package = "solana-pubkey", version = "=3.0.0" }
solana-pubkey-new = { package = "solana-pubkey", version = "=4.2.0" }
solana-sdk-ids = "=3.1.0"
pin-borsh-derive-1-6-0 = { package = "borsh-derive", version = "=1.6.0", default-features = false, optional = true }
pin-curve25519-dalek-4-1-3 = { package = "curve25519-dalek", version = "=4.1.3", default-features = false, optional = true }
pin-curve25519-dalek-derive-0-1-1 = { package = "curve25519-dalek-derive", version = "=0.1.1", default-features = false, optional = true }
pin-digest-0-10-7 = { package = "digest", version = "=0.10.7", default-features = false, optional = true }
pin-serde-1-0-228 = { package = "serde", version = "=1.0.228", default-features = false, optional = true }
pin-serde_core-1-0-228 = { package = "serde_core", version = "=1.0.228", default-features = false, optional = true }
pin-serde_derive-1-0-228 = { package = "serde_derive", version = "=1.0.228", default-features = false, optional = true }
pin-sha2-0-10-9 = { package = "sha2", version = "=0.10.9", default-features = false, optional = true }
pin-solana-address-1-1-0 = { package = "solana-address", version = "=1.1.0", default-features = false, optional = true }
pin-solana-define-syscall-4-0-1 = { package = "solana-define-syscall", version = "=4.0.1", default-features = false, optional = true }
pin-solana-define-syscall-5-1-0 = { package = "solana-define-syscall", version = "=5.1.0", default-features = false, optional = true }
pin-solana-hash-4-5-0 = { package = "solana-hash", version = "=4.5.0", default-features = false, optional = true }
pin-solana-instruction-3-4-0 = { package = "solana-instruction", version = "=3.4.0", default-features = false, optional = true }
pin-solana-program-error-3-0-1 = { package = "solana-program-error", version = "=3.0.1", default-features = false, optional = true }
pin-solana-sanitize-3-0-1 = { package = "solana-sanitize", version = "=3.0.1", default-features = false, optional = true }
pin-solana-sha256-hasher-3-1-0 = { package = "solana-sha256-hasher", version = "=3.1.0", default-features = false, optional = true }
pin-wincode-0-5-5 = { package = "wincode", version = "=0.5.5", default-features = false, optional = true }
pin-wincode-derive-0-4-6 = { package = "wincode-derive", version = "=0.4.6", default-features = false, optional = true }

[features]
default = []
seed = []
legacy_io = []
