# Modeled dependencies use exact constraints; incidental packages resolve afresh.
# The host build selects the Solana cfg; it is a separate native observation profile.
# The ahash 0.7.9 constraint selects the published crates.io archive.

[package]
name = "conformance-anchor-lifecycle"
version = "0.1.0"
edition = "2021"
publish = false
workspace = "../workspaces/profile-12"

[features]
default = ["legacy-anchor", "account-info-2", "legacy-program-error"]
legacy-anchor = []
account-info-2 = []
legacy-program-error = []
split-sysvar = []

[dependencies]
conformance-recorder = { path = "../recorder" }
conformance-shim = { path = "../shim" }
conformance-accounts = { path = "../accounts" }
anchor-lang = "=0.27.0"
serde = { version = "=1.0.159", features = ["derive"] }
solana-program = "=1.15.2"
pin-anchor-attribute-access-control-0-27-0 = { package = "anchor-attribute-access-control", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-attribute-account-0-27-0 = { package = "anchor-attribute-account", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-attribute-constant-0-27-0 = { package = "anchor-attribute-constant", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-attribute-error-0-27-0 = { package = "anchor-attribute-error", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-attribute-event-0-27-0 = { package = "anchor-attribute-event", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-attribute-program-0-27-0 = { package = "anchor-attribute-program", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-derive-accounts-0-27-0 = { package = "anchor-derive-accounts", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-derive-space-0-27-0 = { package = "anchor-derive-space", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-syn-0-27-0 = { package = "anchor-syn", version = "=0.27.0", default-features = false, optional = true }
pin-base64-0-12-3 = { package = "base64", version = "=0.12.3", default-features = false, optional = true }
