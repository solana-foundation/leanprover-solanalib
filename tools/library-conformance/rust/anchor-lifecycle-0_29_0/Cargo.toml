# Modeled dependencies use exact constraints; incidental packages resolve afresh.
# The host build selects the Solana cfg; it is a separate native observation profile.

[package]
name = "conformance-anchor-lifecycle"
version = "0.1.0"
edition = "2021"
publish = false
workspace = "../workspaces/profile-10"

[features]
default = ["account-info-2", "legacy-program-error"]
legacy-anchor = []
account-info-2 = []
legacy-program-error = []
split-sysvar = []

[dependencies]
conformance-recorder = { path = "../recorder" }
conformance-shim = { path = "../shim" }
conformance-accounts = { path = "../accounts" }
anchor-lang = "=0.29.0"
serde = { version = "=1.0.216", features = ["derive"] }
solana-program = "=1.18.26"
pin-anchor-attribute-access-control-0-29-0 = { package = "anchor-attribute-access-control", version = "=0.29.0", default-features = false, optional = true }
pin-anchor-attribute-account-0-29-0 = { package = "anchor-attribute-account", version = "=0.29.0", default-features = false, optional = true }
pin-anchor-attribute-constant-0-29-0 = { package = "anchor-attribute-constant", version = "=0.29.0", default-features = false, optional = true }
