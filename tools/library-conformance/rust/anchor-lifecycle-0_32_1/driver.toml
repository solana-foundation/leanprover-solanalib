# Calls linked Anchor lifecycle implementations with explicit generic trait fixtures.
scope = "linked-source"
corpora = ["anchor_lifecycle_0_32_1"]
inputs = ["rust/anchor-account-world/world.rs", "rust/anchor/src/track.rs", "rust/anchor-lifecycle-shared/enc.rs", "rust/anchor-lifecycle-shared/script.rs", "rust/anchor-lifecycle-shared/cases.rs"]

# The complete retained backing is checked after a close shrinks the data slice.
spare_writes = ["<anchor_lang::accounts::account::Account<'info, T> as anchor_lang::AccountsClose<'info>>::close"]

[build_probe]
argument = "--build-config"
profile = "dev"
panic = "unwind"
