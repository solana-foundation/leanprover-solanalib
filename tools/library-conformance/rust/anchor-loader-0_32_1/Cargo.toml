[package]
name = "conformance-anchor-loader"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native AccountLoader observations at Anchor 0.32.1"

[features]
default = ["account-info-2"]
account-info-2 = []

[dependencies]
conformance-recorder = { path = "../recorder" }
conformance-shim = { path = "../shim" }
conformance-accounts = { path = "../accounts" }
anchor-lang = "=0.32.1"
solana-account-info = "=2.3.0"
solana-program-error = "=2.2.2"
bytemuck = "=1.22.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
