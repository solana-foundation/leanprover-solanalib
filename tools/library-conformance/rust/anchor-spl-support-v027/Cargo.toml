publish = false
# Cargo.lock fixes the complete dependency graph.

[dependencies]
conformance-recorder = { path = "../recorder" }
anchor-lang = "=0.27.0"
anchor-spl = { version = "=0.27.0", default-features = false, features = ["stake", "token"] }
