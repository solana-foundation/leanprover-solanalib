[package]
name = "conformance-anchor-spl-support-v029"
version = "0.1.0"
edition = "2021"
publish = false
# Cargo.lock fixes the complete dependency graph.

[dependencies]
conformance-recorder = { path = "../recorder" }
anchor-lang = "=0.29.0"
anchor-spl = { version = "=0.29.0", default-features = false, features = ["token", "token_2022"] }

[features]
default = ["v029", "legacy", "token", "interface"]
v027 = []
v029 = []
v0321 = []
v102 = []
v112 = []
legacy = []
memo = []
metadata = []
associated = []
token = []
interface = []

[profile.dev]
panic = "unwind"
