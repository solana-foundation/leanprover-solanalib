[package]
name = "conformance-anchor-spl-token-0-27-0"
version = "0.1.0"
edition = "2021"
publish = false
description = "Exact projected Anchor SPL 0.27.0 token wrappers with whole-signature CPI providers"
workspace = "../workspaces/profile-12"

[dependencies]
conformance-recorder = { path = "../recorder" }
anchor-lang = "=0.27.0"
anchor-spl = { version = "=0.27.0", default-features = false, features = ["token"] }
spl-token = { version = "=3.5.0", features = ["no-entrypoint"] }
solana-program = "=1.15.2"
pin-anchor-attribute-access-control-0-27-0 = { package = "anchor-attribute-access-control", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-attribute-account-0-27-0 = { package = "anchor-attribute-account", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-attribute-constant-0-27-0 = { package = "anchor-attribute-constant", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-attribute-error-0-27-0 = { package = "anchor-attribute-error", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-attribute-event-0-27-0 = { package = "anchor-attribute-event", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-attribute-program-0-27-0 = { package = "anchor-attribute-program", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-derive-accounts-0-27-0 = { package = "anchor-derive-accounts", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-derive-space-0-27-0 = { package = "anchor-derive-space", version = "=0.27.0", default-features = false, optional = true }
pin-anchor-syn-0-27-0 = { package = "anchor-syn", version = "=0.27.0", default-features = false, optional = true }
pin-base64-0-12-3 = { package = "base64", version = "=0.12.3", default-features = false, optional = true }
pin-base64-0-13-1 = { package = "base64", version = "=0.13.1", default-features = false, optional = true }
pin-bincode-1-3-3 = { package = "bincode", version = "=1.3.3", default-features = false, optional = true }
pin-blake3-1-3-3 = { package = "blake3", version = "=1.3.3", default-features = false, optional = true }
pin-borsh-0-9-3 = { package = "borsh", version = "=0.9.3", default-features = false, optional = true }
pin-borsh-derive-0-9-3 = { package = "borsh-derive", version = "=0.9.3", default-features = false, optional = true }
pin-borsh-derive-internal-0-9-3 = { package = "borsh-derive-internal", version = "=0.9.3", default-features = false, optional = true }
pin-borsh-schema-derive-internal-0-9-3 = { package = "borsh-schema-derive-internal", version = "=0.9.3", default-features = false, optional = true }
pin-bs58-0-3-1 = { package = "bs58", version = "=0.3.1", default-features = false, optional = true }
pin-bs58-0-4-0 = { package = "bs58", version = "=0.4.0", default-features = false, optional = true }
pin-bytemuck-1-13-1 = { package = "bytemuck", version = "=1.13.1", default-features = false, optional = true }
pin-bytemuck_derive-1-4-1 = { package = "bytemuck_derive", version = "=1.4.1", default-features = false, optional = true }
pin-curve25519-dalek-3-2-1 = { package = "curve25519-dalek", version = "=3.2.1", default-features = false, optional = true }
pin-digest-0-9-0 = { package = "digest", version = "=0.9.0", default-features = false, optional = true }
pin-digest-0-10-6 = { package = "digest", version = "=0.10.6", default-features = false, optional = true }
pin-keccak-0-1-3 = { package = "keccak", version = "=0.1.3", default-features = false, optional = true }
