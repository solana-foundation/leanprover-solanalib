pin-serde-1-0-159 = { package = "serde", version = "=1.0.159", default-features = false, optional = true }
pin-serde_derive-1-0-159 = { package = "serde_derive", version = "=1.0.159", default-features = false, optional = true }
pin-sha2-0-9-9 = { package = "sha2", version = "=0.9.9", default-features = false, optional = true }
pin-sha2-0-10-6 = { package = "sha2", version = "=0.10.6", default-features = false, optional = true }
pin-sha3-0-10-6 = { package = "sha3", version = "=0.10.6", default-features = false, optional = true }

[features]
default = ["v0270", "inline-error"]
v0270 = []
v0290 = []
v0321 = []
v102 = []
v112 = []
modern-context = []
inline-error = []
