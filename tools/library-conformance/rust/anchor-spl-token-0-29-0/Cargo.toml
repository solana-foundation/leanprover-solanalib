[package]
name = "conformance-anchor-spl-token-0-29-0"
version = "0.1.0"
edition = "2021"
publish = false
description = "Exact projected Anchor SPL 0.29.0 token wrappers with whole-signature CPI providers"

[dependencies]
conformance-recorder = { path = "../recorder" }
anchor-lang = "=0.29.0"
anchor-spl = { version = "=0.29.0", default-features = false, features = ["token", "token_2022"] }
spl-token-2022 = { version = "=0.9.0", features = ["no-entrypoint"] }
solana-program = "=1.18.26"

[features]
default = ["v0290"]
v0270 = []
v0290 = []
v0321 = []
v102 = []
v112 = []
modern-context = []
inline-error = []

[profile.dev]
panic = "unwind"
