[package]
name = "conformance-anchor-spl-token-0-32-1"
version = "0.1.0"
edition = "2021"
publish = false
description = "Exact projected Anchor SPL 0.32.1 token wrappers with whole-signature CPI providers"

[dependencies]
conformance-recorder = { path = "../recorder" }
anchor-lang = "=0.32.1"
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions"] }
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "=8.0.1", features = ["no-entrypoint"] }
solana-account-info = "=2.3.0"
solana-program-error = "=2.2.2"
solana-pubkey = "=2.2.1"

[features]
default = ["v0321"]
v0270 = []
v0290 = []
v0321 = []
v102 = []
v112 = []
modern-context = []
inline-error = []

[profile.dev]
panic = "unwind"
