[package]
name = "conformance-anchor-system-0-32-1"
version = "0.1.0"
edition = "2021"
publish = false
description = "Source-projected Anchor 0.32.1 System wrappers with an opaque invocation provider"

[dependencies]
conformance-recorder = { path = "../recorder" }
anchor-lang = "=0.32.1"
bincode = "=1.3.3"
solana-account-info = "=2.3.0"
solana-program-error = "=2.2.2"
solana-system-interface = "=1.0.0"
solana-pubkey = "=2.2.1"

[features]
default = ["system-id"]
inline-error = []
modern-context = []
system-id = []

[profile.dev]
panic = "unwind"
