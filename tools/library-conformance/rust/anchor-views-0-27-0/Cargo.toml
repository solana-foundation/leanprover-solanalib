# Frozen resolved versions retained from the selected source profile.
[package]
name = "conformance-anchor-views"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anchor-lang = "=0.27.0"
serde = { version = "=1.0.159", features = ["derive"] }
conformance-recorder = { path = "../recorder" }
conformance-shim = { path = "../shim" }

[features]
default = ["legacy-info", "old-error", "owned-info"]
owned-info = []
legacy-info = []
old-error = []
lamports = []
debug = ["anchor-lang/anchor-debug"]

[profile.dev]
panic = "unwind"

[patch.crates-io]
ahash = { version = "=0.7.6", path = "../prepared/ahash-0.7.6" }
