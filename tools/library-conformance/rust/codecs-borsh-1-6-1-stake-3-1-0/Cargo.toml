[package]
name = "conformance-codecs-borsh-1-6-1-stake-3-1-0"
version = "0.1.0"
edition = "2021"
publish = false
description = "Records borsh 1.6.1, bytemuck 1.25.0, solana-stake-interface 3.1.0 and solana-address 2.6.0"
workspace = "../workspaces/profile-06"

[dependencies]
conformance-recorder = { path = "../recorder" }
borsh = "=1.6.1"
bytemuck = "=1.25.0"
solana-address = { version = "=2.6.0", features = ["borsh"] }
solana-stake-interface = { version = "=3.1.0", features = ["borsh"] }
pin-borsh-derive-1-6-1 = { package = "borsh-derive", version = "=1.6.1", default-features = false, optional = true }
pin-bs58-0-5-1 = { package = "bs58", version = "=0.5.1", default-features = false, optional = true }
pin-serde_core-1-0-228 = { package = "serde_core", version = "=1.0.228", default-features = false, optional = true }
pin-serde_derive-1-0-228 = { package = "serde_derive", version = "=1.0.228", default-features = false, optional = true }
pin-solana-clock-3-0-1 = { package = "solana-clock", version = "=3.0.1", default-features = false, optional = true }
pin-solana-define-syscall-5-1-0 = { package = "solana-define-syscall", version = "=5.1.0", default-features = false, optional = true }
pin-solana-instruction-3-4-0 = { package = "solana-instruction", version = "=3.4.0", default-features = false, optional = true }
pin-solana-msg-3-1-0 = { package = "solana-msg", version = "=3.1.0", default-features = false, optional = true }
pin-solana-program-error-3-0-1 = { package = "solana-program-error", version = "=3.0.1", default-features = false, optional = true }
pin-solana-pubkey-4-2-0 = { package = "solana-pubkey", version = "=4.2.0", default-features = false, optional = true }
pin-solana-sanitize-3-0-1 = { package = "solana-sanitize", version = "=3.0.1", default-features = false, optional = true }
pin-solana-system-interface-3-2-0 = { package = "solana-system-interface", version = "=3.2.0", default-features = false, optional = true }
pin-wincode-0-5-4 = { package = "wincode", version = "=0.5.4", default-features = false, optional = true }
pin-wincode-derive-0-4-5 = { package = "wincode-derive", version = "=0.4.5", default-features = false, optional = true }
