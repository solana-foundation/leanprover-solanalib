[package]
name = "conformance-codecs-borsh-1-6-1-stake-3-1-0"
version = "0.1.0"
edition = "2021"
publish = false
description = "Records borsh 1.6.1, bytemuck 1.25.0, solana-stake-interface 3.1.0 and solana-address 2.6.0"

[dependencies]
conformance-recorder = { path = "../recorder" }
borsh = "=1.6.1"
bytemuck = "=1.25.0"
solana-address = { version = "=2.6.0", features = ["borsh"] }
solana-stake-interface = { version = "=3.1.0", features = ["borsh"] }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
