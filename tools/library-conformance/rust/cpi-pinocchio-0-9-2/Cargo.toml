[package]
name = "conformance-cpi-pinocchio-0-9-2"
version = "0.1.0"
edition = "2021"
publish = false

[features]
signature-check = []

[dependencies]
pinocchio = "=0.9.2"
conformance-recorder = { path = "../recorder" }
conformance-accounts = { path = "../accounts" }

[profile.dev]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
