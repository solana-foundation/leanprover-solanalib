[package]
name = "conformance-cpi-program-2-3-0"
version = "0.1.0"
edition = "2021"
publish = false

[features]
signature-check = []

[dependencies]
conformance-recorder = { path = "../recorder" }
solana-program = "=2.3.0"
solana-cpi = "=2.2.1"
solana-account-info = "=2.3.0"
solana-instruction = "=2.3.3"
solana-stable-layout = "=2.2.1"
solana-program-error = "=2.2.2"

[profile.dev]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
