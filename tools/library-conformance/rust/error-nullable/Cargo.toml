[package]
name = "conformance-error-nullable"
version = "0.1.0"
edition = "2021"
publish = false
workspace = "../workspaces/profile-03"

[dependencies]
conformance-recorder = { path = "../recorder" }
pinocchio = { version = "=0.10.2", features = ["copy"] }
solana-address = { version = "=2.6.1", features = ["nullable", "copy"] }
solana-nullable = "=1.3.0"
solana-program-error = "=3.0.1"
pin-solana-account-view-1-0-0 = { package = "solana-account-view", version = "=1.0.0", default-features = false, optional = true }
pin-solana-define-syscall-4-0-1 = { package = "solana-define-syscall", version = "=4.0.1", default-features = false, optional = true }
pin-solana-define-syscall-5-2-0 = { package = "solana-define-syscall", version = "=5.2.0", default-features = false, optional = true }
pin-solana-instruction-view-1-0-0 = { package = "solana-instruction-view", version = "=1.0.0", default-features = false, optional = true }
