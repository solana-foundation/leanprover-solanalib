# Modeled dependencies use exact constraints; incidental packages resolve afresh.
# This native observation profile uses panic=unwind. A source binding that uses
# panic=abort must justify that strategy and the selected Solana cfg separately.

[package]
name = "conformance-instruction-extensions-wincode"
version = "0.1.0"
edition = "2021"
publish = false
workspace = "../workspaces/profile-04"

[features]
default = ["prefund"]
seeded = []
prefund = []

[dependencies]
conformance-recorder = { path = "../recorder" }
serde = "=1.0.228"
solana-instruction = { version = "=3.4.0", features = ["bincode", "wincode"] }
solana-system-interface = { version = "=3.2.0", features = ["bincode", "wincode"] }
solana-address = "=2.6.1"
pin-bincode-1-3-3 = { package = "bincode", version = "=1.3.3", default-features = false, optional = true }
pin-serde_core-1-0-228 = { package = "serde_core", version = "=1.0.228", default-features = false, optional = true }
pin-serde_derive-1-0-228 = { package = "serde_derive", version = "=1.0.228", default-features = false, optional = true }
pin-solana-define-syscall-5-1-0 = { package = "solana-define-syscall", version = "=5.1.0", default-features = false, optional = true }
pin-solana-msg-3-1-0 = { package = "solana-msg", version = "=3.1.0", default-features = false, optional = true }
pin-solana-program-error-3-0-1 = { package = "solana-program-error", version = "=3.0.1", default-features = false, optional = true }
pin-solana-pubkey-4-2-0 = { package = "solana-pubkey", version = "=4.2.0", default-features = false, optional = true }
pin-solana-sanitize-3-0-1 = { package = "solana-sanitize", version = "=3.0.1", default-features = false, optional = true }
pin-wincode-0-5-5 = { package = "wincode", version = "=0.5.5", default-features = false, optional = true }
pin-wincode-derive-0-4-6 = { package = "wincode-derive", version = "=0.4.6", default-features = false, optional = true }
