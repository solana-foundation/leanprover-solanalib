# pinocchio 0.11.1 enables cpi, copy and account-resize; modeled versions are exact.

[package]
name = "conformance-instruction-view-2-1-0-cpi"
version = "0.1.0"
edition = "2021"
publish = false
description = "Records solana-instruction-view 2.1.0, pinocchio-system 0.6.0 and pinocchio-associated-token-account 0.4.0"
workspace = "../workspaces/profile-06"

[dependencies]
conformance-recorder = { path = "../recorder" }
conformance-shim = { path = "../shim" }
conformance-accounts = { path = "../accounts" }
solana-instruction-view = { version = "=2.1.0", features = ["cpi"] }
solana-account-view = "=2.0.0"
solana-address = "=2.6.0"
pinocchio = { version = "=0.11.1", features = ["cpi", "copy", "account-resize"] }
pinocchio-system = "=0.6.0"
pinocchio-associated-token-account = "=0.4.0"
solana-program-error = "=3.0.1"
pin-digest-0-10-7 = { package = "digest", version = "=0.10.7", default-features = false, optional = true }
pin-sha2-0-10-9 = { package = "sha2", version = "=0.10.9", default-features = false, optional = true }
pin-solana-define-syscall-4-0-1 = { package = "solana-define-syscall", version = "=4.0.1", default-features = false, optional = true }
pin-solana-define-syscall-5-1-0 = { package = "solana-define-syscall", version = "=5.1.0", default-features = false, optional = true }
pin-solana-hash-4-3-0 = { package = "solana-hash", version = "=4.3.0", default-features = false, optional = true }
pin-solana-sha256-hasher-3-1-0 = { package = "solana-sha256-hasher", version = "=3.1.0", default-features = false, optional = true }
