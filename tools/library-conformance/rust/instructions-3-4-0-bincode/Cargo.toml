[package]
name = "conformance-instructions-3-4-0-bincode"
version = "0.1.0"
edition = "2021"
publish = false
description = "Records solana-instruction 3.4.0, solana-system-interface 3.2.0 (bincode), solana-borsh 3.0.2, switchboard-on-demand 0.12.1 and the pyth-solana-receiver-sdk 2.0.0 getter"

# solana-system-interface uses bincode. switchboard-on-demand disables default
# features and enables cpi and solana-v3. Exact transitive versions are locked.

[dependencies]
conformance-recorder = { path = "../recorder" }
solana-instruction = { version = "=3.4.0", features = ["bincode"] }
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-address = "=2.6.0"
solana-borsh = "=3.0.2"
borsh = "=1.6.1"
serde = "=1.0.228"
solana-clock = "=3.0.1"
pyth-solana-receiver-sdk = "=2.0.0"
switchboard-on-demand = { git = "https://github.com/switchboard-xyz/switchboard-sdk", rev = "f75b1ef63e10eda35d046b1838810ec2935d7f39", default-features = false, features = ["cpi", "solana-v3"] }
bytemuck = "=1.25.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
