# solana-system-interface 3.2.0 has both bincode and wincode, so
# create_instruction selects new_with_wincode. pinocchio 0.10.2 default alloc
# enables the slice-cpi feature of solana-instruction-view.

[package]
name = "conformance-instructions-3-4-0-wincode"
version = "0.1.0"
edition = "2021"
publish = false
description = "Records solana-instruction 3.4.0 wincode construction, solana-system-interface 3.2.0 (wincode) and solana-instruction-view 1.0.0"
workspace = "../workspaces/profile-03"

[dependencies]
conformance-recorder = { path = "../recorder" }
conformance-shim = { path = "../shim" }
conformance-accounts = { path = "../accounts" }
solana-instruction = { version = "=3.4.0", features = ["bincode", "wincode"] }
solana-system-interface = { version = "=3.2.0", features = ["bincode", "wincode"] }
solana-address = "=2.6.1"
wincode = "=0.5.5"
solana-instruction-view = { version = "=1.0.0", features = ["slice-cpi"] }
solana-account-view = "=1.0.0"
solana-program-error = "=3.0.1"
pin-bincode-1-3-3 = { package = "bincode", version = "=1.3.3", default-features = false, optional = true }
pin-serde-1-0-229 = { package = "serde", version = "=1.0.229", default-features = false, optional = true }
pin-serde_core-1-0-229 = { package = "serde_core", version = "=1.0.229", default-features = false, optional = true }
pin-serde_derive-1-0-229 = { package = "serde_derive", version = "=1.0.229", default-features = false, optional = true }
pin-solana-define-syscall-4-0-1 = { package = "solana-define-syscall", version = "=4.0.1", default-features = false, optional = true }
pin-solana-define-syscall-5-2-0 = { package = "solana-define-syscall", version = "=5.2.0", default-features = false, optional = true }
pin-solana-msg-3-1-0 = { package = "solana-msg", version = "=3.1.0", default-features = false, optional = true }
pin-solana-pubkey-4-2-0 = { package = "solana-pubkey", version = "=4.2.0", default-features = false, optional = true }
pin-solana-sanitize-3-0-1 = { package = "solana-sanitize", version = "=3.0.1", default-features = false, optional = true }
pin-wincode-derive-0-4-6 = { package = "wincode-derive", version = "=0.4.6", default-features = false, optional = true }
