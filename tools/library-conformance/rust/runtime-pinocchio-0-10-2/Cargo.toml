[package]
name = "conformance-runtime-pinocchio-0-10-2"
version = "0.1.0"
edition = "2021"
publish = false
description = "Records the pinned runtime helpers: pinocchio 0.10.2 (Rent arithmetic, Clock/Rent getters), solana-msg 3.1.0, solana-program 4.0.0, solana-sha256-hasher 3.1.0, solana-curve25519 3.1.12, solana-hash 4.5.0, solana-sdk-ids 3.1.0, solana-zero-copy 1.2.0 and solana-program-option 3.1.0"

# pinocchio enables cpi; solana-curve25519 enables agave-unstable-api.
# Syscalls reach the shared shim (../shim).

[dependencies]
conformance-recorder = { path = "../recorder" }
conformance-shim = { path = "../shim" }
pinocchio = { version = "=0.10.2", features = ["cpi"] }
solana-msg = "=3.1.0"
solana-program = "=4.0.0"
solana-sha256-hasher = "=3.1.0"
solana-curve25519 = { version = "=3.1.12", features = ["agave-unstable-api"] }
solana-hash = "=4.5.0"
solana-sdk-ids = "=3.1.0"
solana-zero-copy = "=1.2.0"
solana-program-option = "=3.1.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
