[package]
name = "conformance-runtime-program-4-0-0-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "Records the host branches of solana-program 4.0.0 sol_log_data and set_return_data (program stubs)"

# Built without the Solana cfg (see .cargo/config.toml). The shim is used
# only for its forked case runner.

[dependencies]
conformance-recorder = { path = "../recorder" }
conformance-shim = { path = "../shim" }
solana-program = "=4.0.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
