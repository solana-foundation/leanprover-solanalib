# Overflow checks are disabled, as in a release arithmetic profile,
# while panics still unwind.

[package]
name = "conformance-runtime-rent-3-0-0-wrapping"
version = "0.1.0"
edition = "2021"
publish = false
description = "Records solana-rent 3.0.0 minimum_balance, built without overflow checks"
workspace = "../workspaces/profile-03"

[dependencies]
conformance-recorder = { path = "../recorder" }
solana-rent = "=3.0.0"
pin-bs58-0-5-1 = { package = "bs58", version = "=0.5.1", default-features = false, optional = true }
