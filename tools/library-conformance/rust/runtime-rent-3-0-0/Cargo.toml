# solana-sysvar 3.1.1 uses solana-rent 3.0.0, matching the model profile.
# Syscalls reach the shared shim (../shim).

[package]
name = "conformance-runtime-rent-3-0-0"
version = "0.1.0"
edition = "2021"
publish = false
description = "Records the pinned runtime helpers: solana-rent 3.0.0 minimum_balance and solana-sysvar 3.1.1 Clock/Rent getters"
workspace = "../workspaces/profile-06"

[dependencies]
conformance-recorder = { path = "../recorder" }
conformance-shim = { path = "../shim" }
solana-rent = "=3.0.0"
solana-sysvar = "=3.1.1"
pin-base64-0-22-1 = { package = "base64", version = "=0.22.1", default-features = false, optional = true }
pin-bs58-0-5-1 = { package = "bs58", version = "=0.5.1", default-features = false, optional = true }
pin-bytemuck-1-25-0 = { package = "bytemuck", version = "=1.25.0", default-features = false, optional = true }
pin-bytemuck_derive-1-10-2 = { package = "bytemuck_derive", version = "=1.10.2", default-features = false, optional = true }
pin-solana-account-info-3-1-1 = { package = "solana-account-info", version = "=3.1.1", default-features = false, optional = true }
pin-solana-address-2-6-0 = { package = "solana-address", version = "=2.6.0", default-features = false, optional = true }
pin-solana-clock-3-0-1 = { package = "solana-clock", version = "=3.0.1", default-features = false, optional = true }
pin-solana-define-syscall-4-0-1 = { package = "solana-define-syscall", version = "=4.0.1", default-features = false, optional = true }
pin-solana-define-syscall-5-1-0 = { package = "solana-define-syscall", version = "=5.1.0", default-features = false, optional = true }
pin-solana-epoch-schedule-3-0-0 = { package = "solana-epoch-schedule", version = "=3.0.0", default-features = false, optional = true }
pin-solana-hash-3-1-0 = { package = "solana-hash", version = "=3.1.0", default-features = false, optional = true }
pin-solana-hash-4-3-0 = { package = "solana-hash", version = "=4.3.0", default-features = false, optional = true }
pin-solana-instruction-3-4-0 = { package = "solana-instruction", version = "=3.4.0", default-features = false, optional = true }
pin-solana-program-entrypoint-3-1-1 = { package = "solana-program-entrypoint", version = "=3.1.1", default-features = false, optional = true }
pin-solana-program-error-3-0-1 = { package = "solana-program-error", version = "=3.0.1", default-features = false, optional = true }
pin-solana-program-memory-3-1-0 = { package = "solana-program-memory", version = "=3.1.0", default-features = false, optional = true }
pin-solana-pubkey-4-2-0 = { package = "solana-pubkey", version = "=4.2.0", default-features = false, optional = true }
pin-solana-sanitize-3-0-1 = { package = "solana-sanitize", version = "=3.0.1", default-features = false, optional = true }
pin-solana-sdk-ids-3-1-0 = { package = "solana-sdk-ids", version = "=3.1.0", default-features = false, optional = true }
