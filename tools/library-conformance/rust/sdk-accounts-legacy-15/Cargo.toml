[package]
name = "conformance-sdk-accounts-legacy-15"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["realloc-api"]
resize-api = []
realloc-api = []
unused-field = []

[dependencies]
conformance-recorder = { path = "../recorder" }
conformance-accounts = { path = "../accounts" }
