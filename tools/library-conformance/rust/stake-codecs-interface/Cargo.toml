[package]
name = "conformance-stake-codecs-interface"
version = "0.1.0"
edition = "2021"
publish = false

# The lockfile fixes the reviewed transitive versions.
[dependencies]
conformance-recorder = { path = "../recorder" }
conformance-shim = { path = "../shim" }
solana-address-lookup-table-interface = { version = "=2.2.2", features = ["bincode", "bytemuck"] }
solana-borsh = "=2.2.1"
solana-pubkey = "=2.4.0"
bincode = "=1.3.3"
borsh = "=0.10.4"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
