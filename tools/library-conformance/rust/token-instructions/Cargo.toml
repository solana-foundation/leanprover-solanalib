[package]
name = "conformance-token-instructions"
version = "0.1.0"
edition = "2021"
publish = false
description = "Exact released SPL instruction constructors and declared IDs"

[dependencies]
conformance-recorder = { path = "../recorder" }
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "=8.0.1", features = ["no-entrypoint"] }
spl-token-metadata-interface = "=0.7.0"
spl-memo = { version = "=6.0.0", features = ["no-entrypoint"] }
solana-pubkey = "=2.2.1"
solana-instruction = "=2.2.1"
solana-program-error = "=2.2.2"
borsh = "=1.5.7"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
