[package]
name = "conformance-token-interface"
version = "0.1.0"
edition = "2021"
publish = false
description = "Records spl-token-interface 2.0.0 and spl-token-2022-interface 3.1.1"

# Both interface crates and their helper dependencies use exact locked versions.

[dependencies]
conformance-recorder = { path = "../recorder" }
spl-token-interface = "=2.0.0"
spl-token-2022-interface = "=3.1.1"
solana-address = "=2.6.1"
solana-pubkey = "=3.0.0"
solana-program-error = "=3.0.1"
solana-program-pack = "=3.1.0"
bytemuck = "=1.25.2"
solana-instruction = "=3.4.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
