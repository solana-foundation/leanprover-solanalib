[package]
name = "conformance-token-views"
version = "0.1.0"
edition = "2021"
publish = false
description = "Records pinocchio-token 0.6.0 and pinocchio-token-2022 0.3.1 (token byte views, Batch, TransferChecked, checked CPI wrappers) over loader input regions"

# The token crates and helper dependencies use exact locked versions.
# This driver uses the features the libraries request. The additional address
# curve25519/borsh and account-view copy features do not change recorded bodies.

[dependencies]
conformance-recorder = { path = "../recorder" }
conformance-shim = { path = "../shim" }
conformance-accounts = { path = "../accounts" }
pinocchio-token = "=0.6.0"
pinocchio-token-2022 = "=0.3.1"
solana-account-view = "=2.0.0"
solana-instruction-view = { version = "=2.1.0", features = ["cpi"] }
solana-address = "=2.6.0"
solana-program-error = "=3.0.1"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
