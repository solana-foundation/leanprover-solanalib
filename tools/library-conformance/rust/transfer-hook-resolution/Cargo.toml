[package]
name = "conformance-transfer-hook-resolution"
version = "0.1.0"
edition = "2021"
publish = false
description = "Records transfer-hook-interface 0.9.0 account preparation and resolution"

# The lock retains the reviewed 0.9.0 dependency closure. The explicitly
# named packages fix the behavior-bearing POD, TLV, account and pubkey versions.
[dependencies]
conformance-recorder = { path = "../recorder" }
conformance-shim = { path = "../shim" }
spl-transfer-hook-interface = "=0.9.0"
spl-tlv-account-resolution = "=0.9.0"
spl-type-length-value = "=0.7.0"
spl-pod = "=0.5.1"
spl-discriminator = "=0.4.1"
solana-account-info = "=2.3.0"
solana-pubkey = "=2.2.1"
solana-instruction = "=2.2.1"
solana-program-error = "=2.2.2"
bytemuck = "=1.22.0"

# The harness uses the dev profile with the reviewed release optimization
# and overflow-check settings. Unwinding is intentional so cleanup is observed.
[profile.dev]
opt-level = 3
debug-assertions = false
overflow-checks = false
panic = "unwind"

[profile.release]
panic = "unwind"
