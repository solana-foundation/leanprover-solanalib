[workspace]
resolver = "2"
members = [
  "../../anchor-loader-1_0_2",
  "../../cpi-invoke-0-4-0-i2-3-3",
  "../../cpi-pinocchio-0-9-2",
  "../../cpi-raw-define-2-3-0",
  "../../cpi-raw-define-3-0-0",
  "../../entry-deserialize",
  "../../pinocchio-09",
  "../../pinocchio-09-values",
  "../../raw-runtime-cpi2",
  "../../raw-runtime-cpi3",
  "../../raw-runtime-define2",
  "../../raw-runtime-define4",
  "../../raw-runtime-pin",
  "../../raw-runtime-pinlog",
  "../../sdk-accounts-2",
  "../../sdk-values-pubkey-240",
  "../../versions-solana-zero-copy-1-1-0",
]

[profile.dev]
panic = "unwind"

[profile.abort]
inherits = "dev"
panic = "abort"

[profile.wrapping]
inherits = "dev"
overflow-checks = false

[profile.optimized]
inherits = "dev"
opt-level = 3
debug-assertions = false
overflow-checks = false
