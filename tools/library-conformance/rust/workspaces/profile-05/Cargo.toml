[workspace]
resolver = "2"
members = [
  "../../anchor-spl-support-v112",
  "../../instruction-extensions-v2-2",
  "../../token-state-interface-3-0-1",
]

[profile.dev]
panic = "unwind"

[profile.abort]
inherits = "dev"
panic = "abort"

[profile.wrapping]
inherits = "dev"
overflow-checks = false

[profile.optimized]
inherits = "dev"
opt-level = 3
debug-assertions = false
overflow-checks = false
