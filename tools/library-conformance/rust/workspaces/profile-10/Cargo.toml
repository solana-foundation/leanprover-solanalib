[workspace]
resolver = "2"
members = [
  "../../anchor-lifecycle-0_29_0",
  "../../anchor-operations-029",
  "../../anchor-spl-token-0-29-0",
  "../../anchor-system-0-29-0",
  "../../anchor-views-0-29-0",
  "../../cpi-program-1-18-26",
  "../../cpi-raw-program-1-18-26",
  "../../instruction-extensions-legacy-18",
  "../../program-pubkey-118",
  "../../sdk-accounts-legacy-18",
  "../../sdk-values-legacy-118",
  "../../stake-codecs-program",
  "../../utility-legacy118",
]

[profile.dev]
panic = "unwind"

[profile.abort]
inherits = "dev"
panic = "abort"

[profile.wrapping]
inherits = "dev"
overflow-checks = false

[profile.optimized]
inherits = "dev"
opt-level = 3
debug-assertions = false
overflow-checks = false
