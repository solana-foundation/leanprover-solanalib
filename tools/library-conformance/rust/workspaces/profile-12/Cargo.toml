[workspace]
resolver = "2"
members = [
  "../../anchor-lifecycle-0_27_0",
  "../../anchor-operations-027",
  "../../anchor-spl-support-v027",
  "../../anchor-spl-token-0-27-0",
  "../../anchor-system-0-27-0",
  "../../anchor-views-0-27-0",
  "../../cpi-program-1-15-2",
  "../../cpi-raw-program-1-15-2",
  "../../instruction-extensions-legacy-15",
  "../../program-pubkey-115",
  "../../raw-runtime-program115",
  "../../sdk-accounts-legacy-15",
  "../../sdk-values-legacy-115",
  "../../stake-codecs-legacy",
  "../../utility-legacy115",
]

[profile.dev]
panic = "unwind"

[profile.abort]
inherits = "dev"
panic = "abort"

[profile.wrapping]
inherits = "dev"
overflow-checks = false

[profile.optimized]
inherits = "dev"
opt-level = 3
debug-assertions = false
overflow-checks = false
