[workspace]
resolver = "2"
members = [
  "../../anchor-operations-032",
  "../../anchor-spl-support-v0321-interface",
  "../../anchor-spl-support-v0321-pubkey240",
  "../../cpi-program-2-3-0",
  "../../stake-codecs-interface",
  "../../utility-split230",
]

[profile.dev]
panic = "unwind"

[profile.abort]
inherits = "dev"
panic = "abort"

[profile.wrapping]
inherits = "dev"
overflow-checks = false

[profile.optimized]
inherits = "dev"
opt-level = 3
debug-assertions = false
overflow-checks = false
